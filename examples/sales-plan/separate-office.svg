<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820">
  <defs><style>
    .wall{fill:none;stroke:#304b54;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#667b80;stroke-width:2}.window{stroke:#74b2bc;stroke-width:11;stroke-linecap:round}.room{font:24px sans-serif;fill:#718087}.note{font:18px sans-serif;fill:#51656b}.small{font:15px sans-serif;fill:#617278}.new{fill:#dceeea;stroke:#278477;stroke-width:3}.desk{fill:#e8def2;stroke:#76569b;stroke-width:3}.play{fill:#fff1c9;stroke:#d29b21;stroke-width:3;stroke-dasharray:8 6}.route{fill:none;stroke:#e07152;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arr)}.label{font:bold 17px sans-serif;fill:#24464d}.tag{fill:#76569b}.tagtext{font:bold 16px sans-serif;fill:white}.door{fill:none;stroke:#71858a;stroke-width:2}.dim{fill:none;stroke:#d34f4f;stroke-width:2;stroke-dasharray:6 5}.dimtext{font:bold 15px sans-serif;fill:#b23c3c}
  </style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07152"/></marker></defs>
  <rect width="1250" height="820" fill="#f7f9f7"/>
  <text x="55" y="58" font-family="sans-serif" font-size="32" fill="#304b54">方案 B｜次卧独立办公＋客厅看护</text>
  <text x="55" y="88" class="note">销售户型图概念布局 · 无可靠比例 · 厨房隔墙保留 · 不作为施工/下单尺寸</text>
  <g id="统一底图" transform="translate(55 120)">
    <rect x="0" y="0" width="900" height="550" rx="5" class="wall"/><path d="M355 0V205M680 0V215M0 205H120M185 205H355M270 205H465M535 205H680M680 0V215M680 295V310H900M680 380V410H900" class="wall"/>
    <line x1="55" y1="0" x2="210" y2="0" class="window"/><line x1="395" y1="0" x2="565" y2="0" class="window"/><line x1="745" y1="0" x2="830" y2="0" class="window"/><line x1="95" y1="550" x2="325" y2="550" class="window"/><path d="M900 438H830M830 438A70 70 0 0 1 900 508" class="door"/>
    <text x="125" y="95" class="room">主卧</text><text x="440" y="95" class="room">次卧</text><text x="760" y="85" class="room">厨房</text><text x="720" y="365" class="room">卫生间</text><text x="750" y="495" class="room">玄关</text><text x="420" y="285" class="room">餐区</text><text x="150" y="345" class="room">客厅</text>
  </g>
  <g id="方案B新增" transform="translate(55 120)">
    <rect x="18" y="255" width="70" height="210" rx="8" fill="#d9e1e1" stroke="#829398" stroke-width="2"/><text x="30" y="350" class="small" transform="rotate(-90 30 350)">低柜 / 电视</text>
    <rect x="125" y="320" width="210" height="90" rx="16" fill="#d9e1e1" stroke="#829398" stroke-width="2"/><text x="190" y="372" class="label">沙发</text>
    <rect x="350" y="330" width="235" height="145" rx="16" class="play"/><text x="410" y="393" class="label">幼儿游戏区</text><text x="390" y="420" class="small">客厅坐姿直接可见</text>
    <rect x="380" y="230" width="210" height="70" rx="8" class="new"/><text x="440" y="272" class="label">餐桌</text>
    <rect x="385" y="25" width="185" height="55" rx="6" class="desk"/><text x="430" y="60" class="label">独立工作台</text><rect x="580" y="25" width="65" height="155" rx="5" class="new"/><text x="600" y="105" class="small" transform="rotate(-90 600 105)">文件 / 衣物柜</text>
    <path d="M405 195Q475 145 545 195" class="door" stroke-dasharray="6 5"/><text x="408" y="175" class="small">建议玻璃门/门上观察窗*</text>
    <rect x="110" y="465" width="170" height="65" rx="6" class="desk"/><text x="135" y="505" class="label">客厅临时工作位</text>
    <rect x="730" y="420" width="150" height="100" rx="5" class="new"/><text x="748" y="460" class="label">L 形封闭玄关柜</text><text x="748" y="489" class="small">换鞋＋童车位</text>
    <path d="M855 535C725 525 650 500 600 440" class="route"/><text x="615" y="510" class="small">入户 → 餐区/客厅</text>
    <line x1="380" y1="15" x2="650" y2="15" class="dim"/><text x="390" y="-2" class="dimtext">重点复尺 1：次卧开间/进深/门洞</text><line x1="715" y1="412" x2="892" y2="412" class="dim"/><text x="700" y="398" class="dimtext">重点复尺 2：玄关转角</text>
  </g>
  <g transform="translate(990 128)"><rect width="226" height="450" rx="10" fill="#fff" stroke="#c8d3d3"/><rect x="16" y="20" width="170" height="34" rx="17" class="tag"/><text x="34" y="43" class="tagtext">B 的核心取舍</text><text id="legend-copy" class="note"><tspan x="16" y="84">✓ 一人可安静</tspan><tspan x="36" y="108">参加视频会议</tspan><tspan x="16" y="139">✓ 玄关收纳容量更高</tspan><tspan x="16" y="170">✓ 客厅仍有</tspan><tspan x="36" y="194">直接看护位</tspan><tspan x="16" y="225">△ 次卧睡眠功能</tspan><tspan x="36" y="249">被压缩</tspan><tspan x="16" y="280">△ 独立办公时</tspan><tspan x="36" y="304">无法始终看见孩子</tspan><tspan x="16" y="335">△ 观察窗须确认</tspan><tspan x="36" y="359">门墙条件</tspan><tspan x="16" y="390" fill="#76569b">紫色：工作位</tspan><tspan x="16" y="421" fill="#b78312">黄色：游戏区</tspan></text></g>
  <g transform="translate(55 715)"><text class="label">先量这 4 处：</text><text x="135" class="note">①次卧开间/进深及门洞墙垛　②入户两侧墙、转角、门扇与电箱　③客餐厅横纵净尺寸　④所有窗台高/窗扇开启</text><text y="35" class="small">*门上观察窗仅是概念建议，须先确认墙体性质、门型与隐私需求；墙体、梁柱、燃气/烟道、机电点位均待现场核验。</text></g>
</svg>
