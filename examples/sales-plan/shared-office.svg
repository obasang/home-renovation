<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820">
  <defs>
    <style>
      .wall{fill:none;stroke:#304b54;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#667b80;stroke-width:2}.window{stroke:#74b2bc;stroke-width:11;stroke-linecap:round}.room{font:24px sans-serif;fill:#718087}.note{font:18px sans-serif;fill:#51656b}.small{font:15px sans-serif;fill:#617278}.new{fill:#dceeea;stroke:#278477;stroke-width:3}.desk{fill:#e8def2;stroke:#76569b;stroke-width:3}.play{fill:#fff1c9;stroke:#d29b21;stroke-width:3;stroke-dasharray:8 6}.route{fill:none;stroke:#e07152;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arr)}.label{font:bold 17px sans-serif;fill:#24464d}.tag{fill:#278477}.tagtext{font:bold 16px sans-serif;fill:white}.door{fill:none;stroke:#71858a;stroke-width:2}.dim{fill:none;stroke:#d34f4f;stroke-width:2;stroke-dasharray:6 5}.dimtext{font:bold 15px sans-serif;fill:#b23c3c}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07152"/></marker>
  </defs>
  <rect width="1250" height="820" fill="#f7f9f7"/>
  <text x="55" y="58" font-family="sans-serif" font-size="32" fill="#304b54">方案 A｜客厅共处型双工位（推荐）</text>
  <text x="55" y="88" class="note">销售户型图概念布局 · 无可靠比例 · 厨房隔墙保留 · 不作为施工/下单尺寸</text>
  <g id="统一底图" transform="translate(55 120)">
    <rect x="0" y="0" width="900" height="550" rx="5" class="wall"/>
    <path d="M355 0V205M680 0V215M0 205H120M185 205H355M270 205H465M535 205H680M680 0V215M680 295V310H900M680 380V410H900" class="wall"/>
    <line x1="55" y1="0" x2="210" y2="0" class="window"/><line x1="395" y1="0" x2="565" y2="0" class="window"/><line x1="745" y1="0" x2="830" y2="0" class="window"/><line x1="95" y1="550" x2="325" y2="550" class="window"/>
    <path d="M900 438H830M830 438A70 70 0 0 1 900 508" class="door"/>
    <text x="125" y="95" class="room">主卧</text><text x="440" y="95" class="room">次卧</text><text x="760" y="85" class="room">厨房</text><text x="720" y="365" class="room">卫生间</text><text x="750" y="495" class="room">玄关</text><text x="420" y="285" class="room">餐区</text><text x="150" y="345" class="room">客厅</text>
  </g>
  <g id="方案A新增" transform="translate(55 120)">
    <rect x="18" y="255" width="70" height="210" rx="8" fill="#d9e1e1" stroke="#829398" stroke-width="2"/><text x="30" y="350" class="small" transform="rotate(-90 30 350)">低柜 / 电视</text>
    <rect x="115" y="315" width="195" height="90" rx="16" fill="#d9e1e1" stroke="#829398" stroke-width="2"/><text x="175" y="367" class="label">沙发</text>
    <path d="M310 360L450 310" class="thin" stroke-dasharray="6 5"/><text x="325" y="300" class="small">坐姿视线可覆盖游戏区</text>
    <rect x="330" y="330" width="235" height="145" rx="16" class="play"/><text x="392" y="393" class="label">幼儿游戏区</text><text x="371" y="420" class="small">软垫＋低矮玩具收纳</text>
    <rect x="365" y="230" width="195" height="70" rx="8" class="new"/><text x="420" y="272" class="label">圆角餐桌</text>
    <rect x="100" y="482" width="260" height="48" rx="6" class="desk"/><line x1="230" y1="482" x2="230" y2="530" class="thin"/><text x="138" y="512" class="label">双人并排工作台</text>
    <rect x="748" y="425" width="132" height="92" rx="5" class="new"/><text x="765" y="462" class="label">封闭玄关柜</text><text x="765" y="488" class="small">中部留空台</text>
    <path d="M855 535C730 525 650 505 590 440" class="route"/><text x="615" y="510" class="small">入户 → 餐区/客厅</text>
    <line x1="100" y1="472" x2="360" y2="472" class="dim"/><text x="118" y="459" class="dimtext">重点复尺 1：南窗下完整墙面</text>
    <line x1="735" y1="418" x2="890" y2="418" class="dim"/><text x="704" y="405" class="dimtext">重点复尺 2：入户门侧墙</text>
  </g>
  <g transform="translate(990 128)"><rect width="226" height="402" rx="10" fill="#fff" stroke="#c8d3d3"/><rect x="16" y="20" width="170" height="34" rx="17" class="tag"/><text x="34" y="43" class="tagtext">A 的核心取舍</text><text id="legend-copy" class="note"><tspan x="16" y="84">✓ 两位成人同室办公</tspan><tspan x="16" y="115">✓ 抬眼可见游戏区</tspan><tspan x="16" y="146">✓ 保留完整</tspan><tspan x="36" y="170">儿童活动面</tspan><tspan x="16" y="201">△ 视频会议互相干扰</tspan><tspan x="16" y="232">△ 工作台放置</tspan><tspan x="36" y="256">取决于南墙长度</tspan><tspan x="16" y="287">绿色：新增收纳</tspan><tspan x="36" y="311">和餐桌</tspan><tspan x="16" y="342" fill="#76569b">紫色：工作位</tspan><tspan x="16" y="373" fill="#b78312">黄色：游戏区</tspan></text></g>
  <g transform="translate(55 715)"><text class="label">先量这 4 处：</text><text x="135" class="note">①南窗下墙面净长/窗台高　②入户门侧墙净长、门扇与强弱电箱　③客餐厅横纵净尺寸　④次卧门洞与两侧墙垛</text><text y="35" class="small">墙体性质、梁柱、燃气/烟道、给排水、空调与插座均未从销售图确认；柜体深度、通道和桌椅尺寸须量房后复核。</text></g>
</svg>
